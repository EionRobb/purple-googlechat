name: macOS
on:
  - push
  - pull_request

jobs:
  build-slice:
    name: build (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            os: macos-latest
            setup: brew
            deployment_target: '11.0'
          - arch: x86_64
            os: macos-15-intel
            setup: macports
            deployment_target: '10.13'

    steps:
      - uses: actions/checkout@v4

      - name: install native arm64 deps (Homebrew)
        if: matrix.setup == 'brew'
        run: |
          brew install pidgin json-glib gettext pkg-config protobuf-c
          echo "PKG_CONFIG_PATH=$(brew --prefix)/lib/pkgconfig:$(brew --prefix)/opt/pidgin/lib/pkgconfig:$(brew --prefix)/opt/gettext/lib/pkgconfig:$(brew --prefix)/opt/protobuf-c/lib/pkgconfig:$(brew --prefix)/opt/json-glib/lib/pkgconfig" >> $GITHUB_ENV
          echo "PROTOBUF_A=$(brew --prefix protobuf-c)/lib/libprotobuf-c.a" >> $GITHUB_ENV

      - name: install MacPorts
        if: matrix.setup == 'macports'
        uses: melusina-org/setup-macports@v1

      - name: install x86_64 deps (MacPorts)
        if: matrix.setup == 'macports'
        run: |
          sudo port -N install pidgin json-glib protobuf-c pkgconfig || {
            sudo find /opt/local/var/macports/logs \
              -path '*/libpurple/main.log' \
              -exec tail -n 200 {} \;
            exit 1
          }
          echo "PKG_CONFIG_PATH=/opt/local/lib/pkgconfig" >> $GITHUB_ENV
          echo "PROTOBUF_A=/opt/local/lib/libprotobuf-c.a" >> $GITHUB_ENV

      - name: build static json-glib
        run: |
          python3 -m venv "$RUNNER_TEMP/build-tools"
          source "$RUNNER_TEMP/build-tools/bin/activate"
          python -m pip install --upgrade meson ninja
          git clone --depth 1 --branch 1.10.6 https://gitlab.gnome.org/GNOME/json-glib.git json-glib-src
          meson setup json-glib-src/build json-glib-src \
            --default-library=static \
            -Dintrospection=disabled \
            -Dtests=false \
            -Ddocumentation=disabled \
            -Dnls=disabled \
            -Dc_args="-arch ${{ matrix.arch }} -mmacosx-version-min=${{ matrix.deployment_target }}" \
            -Dc_link_args="-arch ${{ matrix.arch }} -mmacosx-version-min=${{ matrix.deployment_target }}"
          ninja -C json-glib-src/build
          echo "JSON_GLIB_A=$PWD/json-glib-src/build/json-glib/libjson-glib-1.0.a" >> $GITHUB_ENV

      - name: build slice
        run: |
          make CFLAGS="-O2 -g -pipe -arch ${{ matrix.arch }} -mmacosx-version-min=${{ matrix.deployment_target }}" \
               LDFLAGS="-arch ${{ matrix.arch }} -mmacosx-version-min=${{ matrix.deployment_target }} -Wl,-undefined,dynamic_lookup" \
               PROTOBUF_OPTS="" \
               PURPLE_LIBS="-lz $PROTOBUF_A $JSON_GLIB_A"
          mv libgooglechat.so libgooglechat_${{ matrix.arch }}.so
          file libgooglechat_${{ matrix.arch }}.so
          otool -L libgooglechat_${{ matrix.arch }}.so

      - name: upload slice artifact
        uses: actions/upload-artifact@v4
        with:
          name: slice-${{ matrix.arch }}
          path: libgooglechat_${{ matrix.arch }}.so

  assemble:
    name: assemble universal binary
    needs: build-slice
    runs-on: macos-latest
    permissions:
      id-token: write
      contents: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - name: download slices
        uses: actions/download-artifact@v4
        with:
          pattern: slice-*
          merge-multiple: true

      - name: stitch universal fat binary
        run: |
          lipo -create libgooglechat_x86_64.so libgooglechat_arm64.so -output libgooglechat_macos.so
          file libgooglechat_macos.so
          otool -L libgooglechat_macos.so

      - name: archive
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !env.ACT
        uses: actions/upload-artifact@v4
        with: 
          name: plugin 
          path: lib*_macos.so

      - name: Set date
        id: date
        run: echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      - name: release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !env.ACT
        uses: ncipollo/release-action@v1
        with:
          artifacts: lib*_macos.so
          tag: daily-${{ steps.date.outputs.DATE }}
          name: Daily ${{ steps.date.outputs.DATE }}
          allowUpdates: true
          makeLatest: true

      - name: attest
        if: github.event_name == 'push' && github.ref == 'refs/heads/master' && !env.ACT
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: lib*_macos.so

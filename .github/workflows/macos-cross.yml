name: macOS Cross (Ubuntu)
on:
  - push
  - pull_request
  - workflow_dispatch

permissions:
  contents: read

jobs:
  cross-build:
    name: cross-compile macOS universal
    runs-on: ubuntu-latest

    env:
      OSXCROSS_COMMIT: 27d21e4977c9751d01199c7a226a6faf494c3dd9
      OSXCROSS: /opt/osxcross

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and Ubuntu headers
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            clang cmake python3 make patch xz-utils bzip2 cpio \
            libxml2-dev libssl-dev zlib1g-dev liblzma-dev libbz2-dev llvm-dev uuid-dev \
            p7zip-full zip pkg-config \
            libglib2.0-dev libjson-glib-dev libpurple-dev protobuf-c-compiler libprotobuf-c-dev

      - name: Cache osxcross
        id: osxcross-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.OSXCROSS }}
          key: osxcross-${{ env.OSXCROSS_COMMIT }}-sdk11.3

      - name: Download SDK and build osxcross
        if: steps.osxcross-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/osxcross/tarballs"
          git clone -q https://github.com/tpoechtrager/osxcross.git "$RUNNER_TEMP/osxcross-src"
          cd "$RUNNER_TEMP/osxcross-src"
          git checkout -q "$OSXCROSS_COMMIT"

          # 11.3 SDK provides x86_64 and arm64 (Apple Silicon)
          curl -fsSL https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz -o tarballs/MacOSX11.3.sdk.tar.xz

          sudo mkdir -p "$OSXCROSS" && sudo chown "$USER" "$OSXCROSS"
          UNATTENDED=1 BUILD_FLAVOR=stable TARGET_DIR="$OSXCROSS" \
            ENABLE_ARCHS="x86_64 arm64" ./build.sh

      - name: Add osxcross to PATH
        run: |
          echo "$OSXCROSS/bin" >> $GITHUB_PATH
          TARGET=$(basename "$(ls -1 "$OSXCROSS"/bin/x86_64-apple-darwin[0-9]*-clang | grep -v cmake | head -n 1)" | sed 's/x86_64-apple-//;s/-clang//')
          echo "Detected Darwin target: $TARGET"
          echo "DARWIN_TARGET=$TARGET" >> $GITHUB_ENV

      - name: Build static protobuf-c slices
        run: |
          git clone --depth 1 https://github.com/protobuf-c/protobuf-c.git protobuf-c-src

          # arm64
          arm64-apple-${DARWIN_TARGET}-clang -O2 -c protobuf-c-src/protobuf-c/protobuf-c.c -Iprotobuf-c-src -o protobuf-c_arm64.o
          $OSXCROSS/bin/arm64-apple-${DARWIN_TARGET}-ar rcs libprotobuf-c_arm64.a protobuf-c_arm64.o

          # x86_64
          x86_64-apple-${DARWIN_TARGET}-clang -O2 -c protobuf-c-src/protobuf-c/protobuf-c.c -Iprotobuf-c-src -o protobuf-c_x86_64.o
          $OSXCROSS/bin/x86_64-apple-${DARWIN_TARGET}-ar rcs libprotobuf-c_x86_64.a protobuf-c_x86_64.o

      - name: Cross-build macOS GLib and static json-glib
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --user meson ninja
          export PATH="$HOME/.local/bin:$PATH"
          # Host Linux pkg-config files must never be used to link Mach-O binaries.
          git clone -q --depth 1 --branch 2.80.5 https://gitlab.gnome.org/GNOME/glib.git glib-src
          git clone -q --depth 1 --branch 1.10.8 https://gitlab.gnome.org/GNOME/json-glib.git json-glib-src
          git clone -q --depth 1 --branch pcre2-10.44 https://github.com/PCRE2Project/pcre2.git pcre2-src
          curl -fsSL https://github.com/libffi/libffi/releases/download/v3.4.6/libffi-3.4.6.tar.gz | tar xz
          for arch in x86_64 arm64; do
            prefix="$PWD/macos-deps/$arch"
            mkdir -p "$prefix/lib/pkgconfig"
            triplet="$arch-apple-$DARWIN_TARGET"
            cc="$OSXCROSS/bin/$triplet-clang"
            # Both dependency projects are built for the same Darwin target.
            cmake -S pcre2-src -B "pcre2-$arch" \
              -DCMAKE_SYSTEM_NAME=Darwin \
              -DCMAKE_C_COMPILER="$cc" \
              -DCMAKE_INSTALL_PREFIX="$prefix" \
              -DBUILD_SHARED_LIBS=OFF -DPCRE2_BUILD_PCRE2_8=ON \
              -DPCRE2_BUILD_PCRE2_16=OFF -DPCRE2_BUILD_PCRE2_32=OFF \
              -DPCRE2_BUILD_TESTS=OFF -DPCRE2_BUILD_PCRE2GREP=OFF
            cmake --build "pcre2-$arch" --parallel 2
            cmake --install "pcre2-$arch"
            (cd "libffi-3.4.6" && ./configure --host="$triplet" --prefix="$prefix" \
              CC="$cc" --disable-shared --enable-static && make -j2 && make install)
            cat > "cross-$arch.ini" <<EOF
          [binaries]
          c = '$cc'
          cpp = '$OSXCROSS/bin/$triplet-clang++'
          objc = '$cc'
          ar = '$OSXCROSS/bin/$triplet-ar'
          strip = '$OSXCROSS/bin/$triplet-strip'
          pkg-config = '/usr/bin/pkg-config'
          [properties]
          pkg_config_libdir = '$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig'
          [host_machine]
          system = 'darwin'
          cpu_family = '$([ "$arch" = arm64 ] && echo aarch64 || echo x86_64)'
          cpu = '$arch'
          endian = 'little'
          EOF
            export PKG_CONFIG_LIBDIR="$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig"
            export PKG_CONFIG_SYSROOT_DIR=""
            meson setup "glib-$arch" glib-src --cross-file "cross-$arch.ini" \
              --prefix="$prefix" --default-library=shared \
              -Dtests=false -Dinstalled_tests=false -Ddocumentation=false \
              -Dintrospection=disabled -Dlibmount=disabled -Dnls=disabled
            meson compile -C "glib-$arch"
            meson install -C "glib-$arch"
            meson setup "json-$arch" json-glib-src --cross-file "cross-$arch.ini" \
              --prefix="$prefix" --default-library=static \
              -Dintrospection=disabled -Dtests=false -Ddocumentation=disabled -Dnls=disabled
            meson compile -C "json-$arch"
            meson install -C "json-$arch"
            test -s "$prefix/lib/libjson-glib-1.0.a"
          done

      - name: Build plugin slices
        run: |
          GLIB_CFLAGS=$(pkg-config --cflags purple)
          COMMON_LDFLAGS="-Wl,-undefined,dynamic_lookup -Wl,-rpath,/opt/homebrew/lib -Wl,-rpath,/usr/local/lib -Wl,-rpath,/opt/local/lib"

          # 1. arm64 slice
          rm -f libgooglechat.so
          make CC=arm64-apple-${DARWIN_TARGET}-clang \
               CFLAGS="-O2 -g -pipe $GLIB_CFLAGS -I$PWD/macos-deps/arm64/include/glib-2.0 -I$PWD/macos-deps/arm64/lib/glib-2.0/include -I$PWD/macos-deps/arm64/include/json-glib-1.0 -I$PWD/protobuf-c-src" \
               LDFLAGS="$COMMON_LDFLAGS" \
               PURPLE_CFLAGS="$GLIB_CFLAGS" \
               PROTOBUF_OPTS="" \
               INCLUDES="" \
               PURPLE_LIBS="$PWD/macos-deps/arm64/lib/libjson-glib-1.0.a -lz $PWD/libprotobuf-c_arm64.a"
          mv libgooglechat.so libgooglechat_arm64.so

          # 2. x86_64 slice
          rm -f libgooglechat.so
          make CC=x86_64-apple-${DARWIN_TARGET}-clang \
               CFLAGS="-O2 -g -pipe $GLIB_CFLAGS -I$PWD/macos-deps/x86_64/include/glib-2.0 -I$PWD/macos-deps/x86_64/lib/glib-2.0/include -I$PWD/macos-deps/x86_64/include/json-glib-1.0 -I$PWD/protobuf-c-src" \
               LDFLAGS="$COMMON_LDFLAGS" \
               PURPLE_CFLAGS="$GLIB_CFLAGS" \
               PROTOBUF_OPTS="" \
               INCLUDES="" \
               PURPLE_LIBS="$PWD/macos-deps/x86_64/lib/libjson-glib-1.0.a -lz $PWD/libprotobuf-c_x86_64.a"
          mv libgooglechat.so libgooglechat_x86_64.so

      - name: Assemble fat binary
        run: |
          LIPO="$OSXCROSS/bin/lipo"
          $LIPO -create libgooglechat_x86_64.so libgooglechat_arm64.so -output libgooglechat_macos.so
          $LIPO -info libgooglechat_macos.so
          file libgooglechat_macos.so

      - name: Upload universal binary
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: libgooglechat-macos-universal
          path: libgooglechat_macos.so
